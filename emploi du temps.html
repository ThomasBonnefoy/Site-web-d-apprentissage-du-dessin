<DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Boutique Lascaux</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <header>
            <a href=""><img src="img/logo.jpg" /></a>
            <nav>
                <a href="">Planning</a>
                <a href="">Conseils</a>
                <a href="">Exercices</a>
            </nav>
        </header>
        <Main>
            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/sCdLEruNklI"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>

            <h1>Emploi du temps</h1>
            <!-- Calendar Container -->
            <div class="calendar">
            <!-- Month and Year Header -->
            <div class="calendar-header">Janvier 2025</div>

            <!-- Days of the Week -->
            <div class="calendar-days">
                <div>Lun</div>
                <div>Mar</div>
                <div>Mer</div>
                <div>Jeu</div>
                <div>Ven</div>
                <div>Sam</div>
                <div>Dim</div>
            </div>

            <!-- Calendar Dates -->
            <div class="calendar-dates">
                <!-- Blank spaces for days before the month starts on Friday -->
                <div></div> <div></div> <div></div> <div>1</div> <div>2</div> <div>3</div> <div>4</div> <div>5</div> <div>6</div> <div>7</div> <div class="today">8</div> <div>9</div> <div>10</div> <div>11</div> <div>12</div> <div>13</div> <div>14</div> <div>15</div> <div>16</div> <div>17</div> <div>18</div> <div>19</div> <div>20</div> <div>21</div><div>22</div> <div>23</div> <div>24</div> <div>25</div> <div>26</div> <div>27</div> <div>28</div><div>29</div> <div>30</div> <div>31</div> <div></div>
            </div>
        </Main>
    </body>
</html>
